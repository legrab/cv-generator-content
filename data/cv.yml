  hu:
    summary:
      - 8 év informatikai tapasztalattal, szoftvermérnöki és informatikaoktatói háttérrel a rendszertervezés és a megvalósítás találkozásánál dolgozom. A bizonytalan követelményeket, az örökölt korlátokat és a rendszerek közötti integrációkat olyan karbantartható szoftverré formálom, amelyet a csapatok megértenek, kiszámíthatóan szállítanak és megbízhatóan támogatnak.
      - Technikai alapjaim a .NET, a C# és az alkalmazásarchitektúra, emellett gyakorlati tapasztalattal rendelkezem JavaScript, React, Blazor, WPF, adatbázisok, API-k, CI/CD folyamatok, éles üzemeltetési támogatás és ipari interfészek terén. Többek között ipari automatizálási, ERP-, pénzügyi, szoftvertesztelési és biomedikai kutatási rendszereken dolgoztam.
      - A rendszerszintű gondolkodást gyakorlatias kreativitással kapcsolom össze. Az absztrakciók megválasztása előtt tisztázom a szereplőket, a korlátokat, az életciklust, az adatáramlásokat és a működési környezetet. Az egyértelmű határokat, a konfigurálható működést és a visszafordítható változtatásokat részesítem előnyben, munkámat pedig AI-alapú eszközökkel támogatom az implementáció, refaktorálás, dokumentáció és más mérnöki feladatok során.

