        period: August 2023 - Present
        intro: Line-control and HMI software for PCB and semiconductor production, where my role combines architecture, implementation, integration work, delivery support, and technical direction.
        bullets:
          - Technical owner for Comandra, a configurable SCADA/HMI and line-control platform built to support production-line behavior, customer-specific workflows, and maintainable runtime deployments.
          - Designed integration structures between HMI screens, backend services, PLCs, device interfaces, databases, scripting, and host systems.
          - Built and modernized production HMI applications across React, Blazor, and WPF frontend technologies.
          - Created workflow, driver, localization, and scripting concepts that kept customer-specific behavior configurable instead of hardcoded.
          - Improved engineering workflows around builds, deployments, documentation, and development feedback loops using Docker, self-hosted agents, proof builds, and LLM-assisted repository work.
          - Delivered and supported five production-line projects, including modernizations, maintained systems, and a full rewrite of a multi-machine sorting-line application.
