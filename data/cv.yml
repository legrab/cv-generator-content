  en-detailed:
    summary:
      - With 8 years in technology, spanning software engineering and computer science education, I work where system design and implementation meet; turning unclear requirements, legacy constraints, and cross-system integrations into maintainable software that teams can understand, deliver, and support with confidence.
      - My technical foundation is .NET, C#, and application architecture, with practical work across JavaScript, React, Blazor, WPF, databases, APIs, CI/CD, production support, and industrial interfaces.
      - Across industrial automation, ERP, finance, software testing, and biomedical research software, I combine systems thinking with pragmatic creativity. I clarify actors, constraints, lifecycles, data flows, failure modes, and operational realities before choosing abstractions, and favor explicit boundaries, configurable behavior, and reversible change.
      - I use LLM tooling for implementation, code analysis, refactoring, documentation, planning, and faster feedback loops. I am open-minded about AI-assisted and agentic development where it improves speed and quality, while remaining deliberate about architecture, review, maintainability, and engineering ownership.

