  de:
    summary:
      - Mit 8 Jahren Erfahrung in der IT, von Softwareentwicklung bis Informatikunterricht, arbeite ich an der Schnittstelle von Systementwurf und Umsetzung. Aus unklaren Anforderungen, gewachsenen Rahmenbedingungen und systemübergreifenden Integrationen entstehen wartbare Lösungen, die Teams verstehen, planbar liefern und verlässlich betreiben können.
      - Mein technisches Fundament bilden .NET, C# und Softwarearchitektur, ergänzt durch praktische Erfahrung mit JavaScript, React, Blazor, WPF, Datenbanken, APIs, CI/CD, Produktionssupport und industriellen Schnittstellen. Ich habe unter anderem in der Industrieautomatisierung, in ERP- und Finanzsystemen, im Softwaretest sowie an Software für die biomedizinische Forschung gearbeitet.
      - Ich verbinde systemisches Denken mit pragmatischer Kreativität und kläre Akteure, Rahmenbedingungen, Lebenszyklen, Datenflüsse und die betriebliche Realität, bevor ich Abstraktionen wähle. Dabei bevorzuge ich klare Grenzen, konfigurierbares Verhalten und reversible Veränderungen und nutze KI-gestützte Werkzeuge für Implementierung, Refactoring, Dokumentation und Engineering-Prozesse.

