content:
  en:
    summary:
      - With 8 years in technology, spanning software engineering and computer science education, I work where system design and implementation meet; turning unclear requirements, legacy constraints, and cross-system integrations into maintainable software that teams can understand, deliver, and support with confidence.
      - My technical foundation is .NET, C#, and application architecture, with practical experience across JavaScript, React, Blazor, WPF, databases, APIs, CI/CD, production support, and industrial interfaces. I have worked in domains including industrial automation, ERP, finance, software testing, and biomedical research software.
      - I combine systems thinking with pragmatic creativity, clarifying actors, constraints, lifecycles, data flows, and operational realities before choosing abstractions. I favor explicit boundaries, configurable behavior, and reversible change, and use AI-assisted tools to support implementation, refactoring, documentation, and engineering workflows.

